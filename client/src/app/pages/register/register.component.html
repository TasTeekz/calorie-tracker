<div class="register-page">
  <h2>Register</h2>

  <form (ngSubmit)="onRegister()">
    <div>
      <label>Username</label>
      <input type="text" name="username" [(ngModel)]="username" required />
    </div>

    <div>
      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="password" required />
    </div>

    <div>
      <label>Age</label>
      <input type="number" name="age" [(ngModel)]="age" min="10" required />
    </div>

    <div>
      <label>Height (cm)</label>
      <input type="number" name="height" [(ngModel)]="height" min="100" required />
    </div>

    <div>
      <label>Weight (kg)</label>
      <input type="number" name="weight" [(ngModel)]="weight" min="20" step="0.1" required />
    </div>

    <div>
      <label>Sex</label>
      <select name="sex" [(ngModel)]="sex" required>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <button type="submit">Register</button>
  </form>

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  @if (successMessage) {
    <p class="success">{{ successMessage }}</p>
  }

  <p>
    Already have an account?
    <a routerLink="/login">Login</a>
  </p>
</div>
