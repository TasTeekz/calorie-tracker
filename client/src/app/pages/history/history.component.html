<div class="history-container">
  <nav class="history-nav">
    <button routerLink="/" class="back-btn">← Назад к трекеру</button>
    <h2>Архив питания</h2>
  </nav>

  <div class="empty-state" *ngIf="(history$ | async)?.length === 0">
    <p>История пока пуста. Начните записывать еду в трекере!</p>
  </div>

  <div class="days-list">
    <div class="day-card" *ngFor="let day of (history$ | async)">
      <div class="day-header" (click)="toggleDay(day)">
        <div class="date-info">
          <strong>{{ day.date | date:'longDate' }}</strong>
        </div>
        <div class="calories-info">
          <span class="total-badge">{{ day.totalCalories }} ккал</span>
          <span class="arrow" [class.rotated]="day.isOpen">▼</span>
        </div>
      </div>

      <div class="day-details" *ngIf="day.isOpen">
        <div class="item-row" *ngFor="let item of day.items">
          <span class="meal-tag">{{ item.mealType }}</span>
          <span class="item-name">{{ item.name }}</span>
          <span class="item-cals">{{ item.calories }} ккал</span>
        </div>
      </div>
    </div>
  </div>
</div>
