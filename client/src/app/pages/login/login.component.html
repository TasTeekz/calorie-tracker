<div class="auth-page">
  <section class="auth-card surface-card">
    <div class="auth-header">
      <span class="chip">Welcome back</span>
      <h2>Login</h2>
      <p>Continue to your nutrition dashboard and daily progress.</p>
    </div>

    <form class="auth-form" (ngSubmit)="onLogin()">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" [(ngModel)]="username" name="username" type="text" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" [(ngModel)]="password" name="password" type="password" required />
      </div>

      <button class="btn btn-primary" type="submit">Login</button>
    </form>

    @if (errorMessage) {
      <p class="status-error">{{ errorMessage }}</p>
    }

    <p class="auth-link">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </section>
</div>
