<div class="profile-page">
  <h2>Profile & Goals</h2>

  @if (loading) {
    <p>Loading...</p>
  }

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  @if (successMessage) {
    <p class="success">{{ successMessage }}</p>
  }

  <div class="form-card">
    <h3>Profile</h3>

    <label for="age">Age</label>
    <input id="age" type="number" [(ngModel)]="age" name="age" />

    <label for="height">Height (cm)</label>
    <input id="height" type="number" [(ngModel)]="height" name="height" />

    <label for="weight">Weight (kg)</label>
    <input id="weight" type="number" [(ngModel)]="weight" name="weight" />
  </div>

  <div class="form-card">
    <h3>Daily Goals</h3>

    <label for="calories">Calories</label>
    <input id="calories" type="number" [(ngModel)]="calorie_goal" name="calorie_goal" />

    <label for="protein">Protein (g)</label>
    <input id="protein" type="number" [(ngModel)]="protein_goal" name="protein_goal" />

    <label for="fat">Fat (g)</label>
    <input id="fat" type="number" [(ngModel)]="fat_goal" name="fat_goal" />

    <label for="carbs">Carbs (g)</label>
    <input id="carbs" type="number" [(ngModel)]="carbs_goal" name="carbs_goal" />
  </div>

  <button class="save-btn" (click)="onSave()">Save</button>
</div>
